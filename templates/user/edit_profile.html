<!DOCTYPE html>
<html>

<head>
    <title>Edit Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: whitesmoke;
            font-size: 30px;
        }
        /* Navbar */
        
        .navbar {
            background: linear-gradient(90deg, #020617, #0f172a);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }
        /* Form Box */
        
        .container {
            width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        
        h2 {
            text-align: center;
            font-size: 50px;
        }
        /* Row style */
        
        .row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .row label {
            width: 150px;
            font-weight: bold;
            font-size: 20px;
        }
        
        .row input,
        .row select,
        .row textarea {
            flex: 1;
            padding: 8px;
            font-size: 20px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background-color: #3f51b5;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            font-size: 20px;
        }
        
        .bottom-text {
            text-align: center;
            margin-top: 10px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <div><b>🎓 Student Performance</b></div>

    </div>

    <!-- Edit Form -->
    <div class="container">
        <h2>✏️ Edit Profile</h2>

        <form method="post">
            {% csrf_token %}

            <div class="row">
                <label>👤 Username</label>
                <input type="text" name="username" value="{{ user.username }}" required>
            </div>



            <div class="row">
                <label>📧 Email</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>

            <div class="row">
                <label>🎓 Course</label>
                <select name="course" required>
                    <option value="{{ user.course }}">{{ user.course }}</option>
                    <option>BCA</option>
                    <option>BBA</option>
                    <option>B.Tech</option>
                </select>
            </div>





            <div class="row">
                <label>📞 Contact</label>
                <input type="text" name="contact" value="{{ user.contact }}" required>
            </div>


            <button type="submit">Update Profile</button>
        </form>

        <div class="bottom-text">
            <a href="{% url 'profile' %}">⬅ Back to Profile</a>
        </div>
    </div>

</body>

</html>
