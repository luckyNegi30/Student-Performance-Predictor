<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: whitesmoke;
        }
        
        .navbar {
            background: linear-gradient(90deg, #020617, #0f172a);
        }
        
        .navbar-brand {
            color: white;
            font-weight: bold;
            font-size: 30px;
        }
        
        .btn-green {
            background-color: #22c55e;
            color: white;
            border-radius: 8px;
        }
        
        .btn-green:hover {
            background-color: #16a34a;
            font-size: 20px;
        }
        
        .form-control,
        .form-select {
            border-radius: 10px;
        }
        
        .card {
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 2);
        }
    </style>
</head>

<body>


    <nav class="navbar navbar-expand-lg px-4">
        <a class="navbar-brand" href="#">🎓 Student Performance Predictor</a>

        <div class="ms-auto">
            <a href="{% url 'login' %}" class="btn btn-success me-2">Login</a>
            <a href="#" class="btn btn-danger">Admin</a>
        </div>
    </nav>

    <!-- 🔷 FORM -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

        <div class="col-md-6">
            <div class="card shadow p-4">

                <h3 class="text-center mb-5 fs-1">✨ Create Account</h3>


                <form method="POST" action="{% url 'register' %}">
                    {% csrf_token %}


                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa fa-user"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Username" required autocomplete="off">
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="Email" required autocomplete="off">
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Password" required autocomplete="off">
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa fa-lock"></i></span>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required autocomplete="off">
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa fa-graduation-cap"></i></span>
                        <select name="course" class="form-select">
                        <option selected>Select Course</option>
                        <option>BCA</option>
                        <option>BBA</option>
                        <option>B-TECH</option>
                    </select>
                    </div>

                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa fa-phone"></i></span>
                        <input type="text" name="contact" class="form-control" placeholder="Contact Number" autocomplete="off">
                    </div>


                    <button type="submit" class="btn btn-green w-100">Register</button>

                    <p class="text-center mt-3 fs-18">
                        Already have an account?
                        <a href="{% url 'login' %}">Login</a>
                    </p>

                </form>

            </div>
        </div>

    </div>

</body>

</html>
