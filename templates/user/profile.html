<!DOCTYPE html>
<html>

<head>
    <title>Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: whitesmoke;
        }
        
        .navbar {
            background: linear-gradient(90deg, #020617, #0f172a);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            font-size: 30px;
            font-weight: bold;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }
        /* Profile Card */
        
        .container {
            width: 600px;
            margin: 60px auto;
            background: linear-gradient(90deg, #1e3a8a, #2563eb);
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 2);
        }
        
        h2 {
            margin-top: 10px;
            color: white;
            font-size: 50px;
        }
        
        h3 {
            margin-bottom: 10px;
            color: yellow;
            font-size: 40px;
        }
        
        .email {
            color: whitesmoke;
            margin-bottom: 15px;
            font-size: 30px;
        }
        /* Profile Circle */
        /* Info Section */
        
        .info-box {
            text-align: left;
            margin-top: 20px;
            font-size: 20px;
        }
        
        .info-box div {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 20px;
        }
        
        .profile-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
        }
        /* Buttons */
        
        .btn {
            display: block;
            margin-top: 12px;
            padding: 10px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        
        .edit-btn {
            background: lightslategray;
        }
        
        .edit-btn:hover {
            background: white;
        }
        
        .back-btn {
            background: #ddd;
            color: black;
        }
        
        .back-btn:hover {
            background: #bbb;
        }
        /* Message */
        
        .msg {
            color: green;
            background: #d4edda;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <div>🎓 Student performance Predictor</div>

    </div>

    <!-- Profile Card -->
    <div class="container">

        {% if messages %} {% for message in messages %}
        <div class="msg">✔ {{ message }}</div>
        {% endfor %} {% endif %}
        <h2>Student Profile</h2>
        <div>
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="profile-img">
        </div>


        <h3>{{ user.username }}</h3>
        <p class="email">{{ user.email }}</p>


        <!-- Info -->
        <div class="info-box">
            <div><b>📚 Course:</b> {{ student.course }}</div>
            <div><b>📞 Contact:</b> {{ student.contact }}</div>
        </div>

        <!-- Buttons -->
        <a href="{% url 'edit_profile' %}" class="btn edit-btn">Edit Profile</a>
        <a href="{% url 'dashboard' %}" class="btn back-btn">Back to Dashboard</a>

    </div>

</body>

</html>
