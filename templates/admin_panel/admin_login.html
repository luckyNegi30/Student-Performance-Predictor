<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title> Admin Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: whitesmoke;
        }
        
        .navbar {
            background: linear-gradient(90deg, #020617, #0f172a);
        }
        
        .navbar-brand {
            color: white;
            font-weight: bold;
            font-size: 30px;
        }
        
        .btn-green {
            background-color: #22c55e;
            color: white;
            border-radius: 8px;
        }
        
        .btn-green:hover {
            background-color: #16a34a;
        }
        
        .form-control {
            border-radius: 8px;
        }
        
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 2);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body>


    <nav class="navbar navbar-expand-lg px-4">
        <a class="navbar-brand" href="#">🎓 Student Performance Predictor</a>
    </nav>


    <div class="container d-flex justify-content-center align-items-center " style="min-height: 80vh; ">

        <div class="col-md-7 col-lg-6">
            <div class="card shadow p-4 ">

                <h3 class="text-center mb-5 fs-1">🔐 Admin Login</h3>


                <form method="POST" action="{% url 'admin_dashboard' %}">
                    {% csrf_token %}


                    <div class="mb-3">
                        <label class="form-label fw-bold fs-4">Admin Name</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autocomplete="off">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold fs-4"> Admin Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="off">
                    </div>

                    <button type="submit" class="btn btn-green w-100">Login</button>


                </form>

            </div>
        </div>

    </div>

</body>

</html>
